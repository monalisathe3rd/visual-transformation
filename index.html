
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Visual Transformation</title>

<style>
:root {
    --background: #F8F6F2;
    --text: #41483F;
    --accent: #A3B59B;
}

* {
    box-sizing: border-box;
}

body {
    background: var(--background);
    color: var(--text);
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 35px 20px;
}

main {
    max-width: 450px;
    margin: auto;
}

h1 {
    font-size: 30px;
    text-align: center;
}

.subtitle {
    text-align: center;
    color: #647160;
}

h2 {
    margin-top: 45px;
    font-size: 21px;
}

.category {
    background: white;
    border: 1px solid #DAE2D6;
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    color: var(--text);
    font-size: 16px;
    text-align: left;
    cursor: pointer;
}

.count {
    color: #83917C;
    font-size: 13px;
}

.back-button {
    background: none;
    border: none;
    color: var(--text);
    font-size: 17px;
    cursor: pointer;
    padding: 10px 0;
}

.placeholder {
    background: white;
    border: 1px solid #DAE2D6;
    border-radius: 16px;
    padding: 30px 20px;
    text-align: center;
    margin-top: 25px;
}

[hidden] {
    display: none !important;
}
</style>
</head>

<body>
<main>

    <!-- HOME SCREEN -->
    <section id="homeScreen">
        <h1>Visual Transformation</h1>
        <p class="subtitle">
            Your transformation begins here.
        </p>

        <h2>My Habits</h2>

        <button class="category"
                onclick="openCategory('Fitness')">
            <span>Fitness</span>
            <span class="count">0 habits ❯</span>
        </button>

        <button class="category"
                onclick="openCategory('Self Care')">
            <span>Self Care</span>
            <span class="count">0 habits ❯</span>
        </button>

        <button class="category"
                onclick="openCategory('Chores / Cleaning')">
            <span>Chores / Cleaning</span>
            <span class="count">0 habits ❯</span>
        </button>
    </section>

    <!-- CATEGORY SCREEN -->
    <section id="categoryScreen" hidden>

        <button class="back-button" onclick="goHome()">
            ← Back
        </button>

        <h2 id="categoryTitle"></h2>

        <button class="category" onclick="addHabit()">
    <span>+ Add Habit</span>
</button>

<div id="habitList"></div>
    </section>

</main>


<script>
let currentCategory = "";

let habits = JSON.parse(
    localStorage.getItem("vtHabits") || "[]"
);

function openCategory(name) {
    currentCategory = name;

    document.getElementById("homeScreen").hidden = true;
    document.getElementById("categoryScreen").hidden = false;
    document.getElementById("categoryTitle").textContent = name;

    showHabits();
}

function goHome() {
    document.getElementById("categoryScreen").hidden = true;
    document.getElementById("homeScreen").hidden = false;
}

function addHabit() {
    let name = prompt("What is your new habit?");

    if (name === null || name.trim() === "") {
        return;
    }

    let habit = {
        id: Date.now(),
        name: name.trim(),
        category: currentCategory
    };

    habits.push(habit);

    localStorage.setItem(
        "vtHabits",
        JSON.stringify(habits)
    );

    showHabits();
    updateCounts();
}

function showHabits() {
    let list = document.getElementById("habitList");
    list.replaceChildren();

    let categoryHabits = habits.filter(
        habit => habit.category === currentCategory
    );

    categoryHabits.forEach(habit => {
        let box = document.createElement("div");
        box.className = "category";

        let name = document.createElement("span");
        name.textContent = habit.name;

        box.appendChild(name);
        list.appendChild(box);
    });
}

function updateCounts() {
    document.querySelectorAll("#homeScreen .category")
        .forEach(button => {
            let category = button.querySelector("span").textContent;

            let count = habits.filter(
                habit => habit.category === category
            ).length;

            button.querySelector(".count").textContent =
                count + " total ❯";
        });
}

updateCounts();
</script>


</body>
</html>
