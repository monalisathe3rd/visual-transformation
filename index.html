<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#F7F5F0" id="themeMeta">
  <meta name="description" content="Visual Transformation — turn little habits into visible progress.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="stylesheet" href="./styles.css">
  <title>Visual Transformation</title>
</head>
<body>
  <div id="app" class="shell">
    <header class="brandbar">
      <div class="brand-mark" aria-hidden="true">✦</div>
      <div class="brand-title"><strong>Visual Transformation</strong><small>Small steps, visible growth</small></div>
      <span class="today-date" id="dateBadge"></span>
    </header>
    <main id="screen" class="screen" tabindex="-1"></main>
    <nav class="bottom-nav" aria-label="Main navigation">
      <button type="button" data-page="home" id="nav-home"><span class="nav-icon">⌂</span>Home</button>
      <button type="button" data-page="tasks" id="nav-tasks"><span class="nav-icon">☑</span>Tasks</button>
      <button type="button" data-page="gallery" id="nav-gallery"><span class="nav-icon">▦</span>Gallery</button>
      <button type="button" data-page="settings" id="nav-settings"><span class="nav-icon">⚙</span>Settings</button>
    </nav>
  </div>
  <dialog id="editor" aria-label="Editor"><div id="dialogContent"></div></dialog>
  <input type="file" id="restoreFile" accept=".json,application/json" hidden>
  <!-- Global file input stays mounted while Android photo picker is open. -->
  <input type="file" id="artPicture" accept="image/png,image/jpeg,image/webp,image/gif" hidden>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="./core.js"></script>
  <script src="./app.js"></script>
</body>
</html>
