
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Visual Transformation</title>

<style>
:root {
    --background: #F8F6F2;
    --text: #41483F;
    --accent: #A3B59B;
}

* {
    box-sizing: border-box;
}

body {
    background: var(--background);
    color: var(--text);
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 35px 20px;
}

main {
    max-width: 450px;
    margin: auto;
}

h1 {
    font-size: 30px;
    text-align: center;
}

.subtitle {
    text-align: center;
    color: #647160;
}

h2 {
    margin-top: 45px;
    font-size: 21px;
}

.category {
    background: white;
    border: 1px solid #DAE2D6;
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    color: var(--text);
    font-size: 16px;
    text-align: left;
    cursor: pointer;
}

.count {
    color: #83917C;
    font-size: 13px;
}

.back-button {
    background: none;
    border: none;
    color: var(--text);
    font-size: 17px;
    cursor: pointer;
    padding: 10px 0;
}

.placeholder {
    background: white;
    border: 1px solid #DAE2D6;
    border-radius: 16px;
    padding: 30px 20px;
    text-align: center;
    margin-top: 25px;
}

[hidden] {
    display: none !important;
}
</style>
</head>

<body>
<main>

    <!-- HOME SCREEN -->
    <section id="homeScreen">
        <h1>Visual Transformation</h1>
        <p class="subtitle">
            Your transformation begins here.
        </p>

        <h2>My Habits</h2>

        <button class="category"
                onclick="openCategory('Fitness')">
            <span>Fitness</span>
            <span class="count">0 habits ❯</span>
        </button>

        <button class="category"
                onclick="openCategory('Self Care')">
            <span>Self Care</span>
            <span class="count">0 habits ❯</span>
        </button>

        <button class="category"
                onclick="openCategory('Chores / Cleaning')">
            <span>Chores / Cleaning</span>
            <span class="count">0 habits ❯</span>
        </button>
        
<button class="back-button" onclick="downloadBackup()">
    ↓ Download My Habit Backup
</button>

<button class="back-button"
        onclick="document.getElementById('restoreFile').click()">
    ↑ Restore My Habit Backup
</button>

<input type="file"
       id="restoreFile"
       accept=".json,application/json"
       hidden
       onchange="restoreBackup(event)">

    </section>

    <!-- CATEGORY SCREEN -->
    <section id="categoryScreen" hidden>

        <button class="back-button" onclick="goHome()">
            ← Back
        </button>

        <h2 id="categoryTitle"></h2>

        <button class="category" onclick="addHabit()">
    <span>+ Add Habit</span>
</button>
<button class="category"
        id="viewAllButton"
        onclick="toggleAllHabits()">
    View All Habits
</button>
<div id="habitList"></div>
    </section>

</main>


<script>
let currentCategory = "";

let habits = JSON.parse(
    localStorage.getItem("vtHabits") || "[]"
);

function openCategory(name) {
    currentCategory = name;

    document.getElementById("homeScreen").hidden = true;
    document.getElementById("categoryScreen").hidden = false;
    document.getElementById("categoryTitle").textContent = name;

    showHabits();
}

function goHome() {
    document.getElementById("categoryScreen").hidden = true;
    document.getElementById("homeScreen").hidden = false;
}

function addHabit() {
    let name = prompt("What is your new habit?");

    if (name === null || name.trim() === "") {
        return;
    }

    let answer = prompt(
        "How many successful days is your goal?",
        "30"
    );

    if (answer === null) return;

    let goalDays = Number(answer);

    if (!Number.isSafeInteger(goalDays) || goalDays < 1) {
        alert("Please enter a whole number greater than zero.");
        return;
    }

    let daysAnswer = prompt(
        "Which days will you do this habit?\n\n" +
        "1 = Monday\n" +
        "2 = Tuesday\n" +
        "3 = Wednesday\n" +
        "4 = Thursday\n" +
        "5 = Friday\n" +
        "6 = Saturday\n" +
        "7 = Sunday\n\n" +
        "Example: 1,3,5\n" +
        "Or type ALL for every day.",
        "ALL"
    );

    if (daysAnswer === null) return;

    let dayNames = [
        "Mon", "Tue", "Wed", "Thu",
        "Fri", "Sat", "Sun"
    ];

    let weekdays = [];

    if (daysAnswer.trim().toUpperCase() === "ALL") {
        weekdays = [...dayNames];
    } else {
        let selected = daysAnswer.split(",").map(
            day => day.trim()
        );

        if (selected.some(day => !/^[1-7]$/.test(day))) {
            alert("Please enter numbers 1-7 separated by commas, or ALL.");
            return;
        }

        weekdays = [...new Set(
            selected.map(day => dayNames[Number(day) - 1])
        )];

        weekdays.sort(
            (a, b) => dayNames.indexOf(a) - dayNames.indexOf(b)
        );
    }

    let habit = {
        id: Date.now(),
        name: name.trim(),
        category: currentCategory,
        goalDays: goalDays,
        weekdays: weekdays
    };

    habits.push(habit);

    localStorage.setItem(
        "vtHabits",
        JSON.stringify(habits)
    );

    showHabits();
    updateCounts();
}

function getTodayDate() {
    let now = new Date();

    let year = now.getFullYear();
    let month = String(now.getMonth() + 1).padStart(2, "0");
    let day = String(now.getDate()).padStart(2, "0");

    return year + "-" + month + "-" + day;
}

function getTodayWeekday() {
    let days = [
        "Sun", "Mon", "Tue", "Wed",
        "Thu", "Fri", "Sat"
    ];

    return days[new Date().getDay()];
}

function getHabitStreak(habit) {
    const weekdays = Array.isArray(habit.weekdays)
        ? habit.weekdays
        : [];

    const completedDates = new Set(
        habit.completedDates || []
    );

    if (weekdays.length === 0) return 0;

    const dayNames = [
        "Sun", "Mon", "Tue", "Wed",
        "Thu", "Fri", "Sat"
    ];

    function dateKey(date) {
        const year = date.getFullYear();
        const month = String(
            date.getMonth() + 1
        ).padStart(2, "0");
        const day = String(
            date.getDate()
        ).padStart(2, "0");

        return year + "-" + month + "-" + day;
    }

    let date = new Date();
    date.setHours(12, 0, 0, 0);

    // Today is not a missed day until it ends.
    if (
        weekdays.includes(dayNames[date.getDay()]) &&
        !completedDates.has(dateKey(date))
    ) {
        date.setDate(date.getDate() - 1);
    }

    let streak = 0;

    // Count backward through scheduled days.
    for (let i = 0; i < 3700; i++) {
        const weekday = dayNames[date.getDay()];

        if (weekdays.includes(weekday)) {
            if (!completedDates.has(dateKey(date))) {
                break;
            }

            streak++;
        }

        date.setDate(date.getDate() - 1);
    }

    return streak;
}

function isDueToday(habit) {
    let completed = habit.completedDates || [];

    let scheduled =
        Array.isArray(habit.weekdays) &&
        habit.weekdays.includes(getTodayWeekday());

    let alreadyDone = completed.includes(getTodayDate());

    let goalReached =
        habit.goalDays &&
        completed.length >= habit.goalDays;

    return scheduled && !alreadyDone && !goalReached;
}

function completeHabit(id) {
    let habit = habits.find(h => h.id === id);

    if (!habit || !isDueToday(habit)) {
        return;
    }

    if (!habit.completedDates) {
        habit.completedDates = [];
    }

    habit.completedDates.push(getTodayDate());
let streak = getHabitStreak(habit);

if (streak > 0 && streak % 14 === 0) {
    habit.streakFreezes = Math.min(
        2,
        (habit.streakFreezes || 0) + 1
    );
}
    localStorage.setItem(
        "vtHabits",
        JSON.stringify(habits)
    );

    showHabits();
    
async function restoreBackup(event) {
    const input = event.target;
    const file = input.files[0];

    if (!file) return;

    input.value = "";

    try {
        const text = await file.text();
        const backup = JSON.parse(text);

        const valid =
            backup &&
            backup.app === "Visual Transformation" &&
            Array.isArray(backup.habits) &&
            backup.habits.every(habit =>
                habit &&
                typeof habit.name === "string" &&
                typeof habit.category === "string" &&
                Number.isSafeInteger(habit.id) &&
                (habit.weekdays === undefined ||
                    Array.isArray(habit.weekdays)) &&
                (habit.completedDates === undefined ||
                    Array.isArray(habit.completedDates))
            );

        if (!valid) {
            alert("This is not a valid Visual Transformation backup.");
            return;
        }

        const confirmed = confirm(
            "This backup contains " +
            backup.habits.length +
            " habits.\n\n" +
            "Restoring it will REPLACE all habits " +
            "currently saved in this browser.\n\n" +
            "Do you want to continue?"
        );

        if (!confirmed) return;

        localStorage.setItem(
            "vtHabits",
            JSON.stringify(backup.habits)
        );

        habits = backup.habits;

        updateCounts();
        goHome();

        alert("Your habits have been restored! 🌷");

    } catch (error) {
        alert(
            "The backup could not be restored. " +
            "Please check the file and try again."
        );
    }
}

    updateCounts();
}

function showHabits() {
        if (showingAllHabits) {
        showAllHabits();
        return;
    }
    let list = document.getElementById("habitList");
    list.replaceChildren();

    let todaysHabits = habits.filter(
        habit =>
            habit.category === currentCategory &&
            isDueToday(habit)
    );

    if (todaysHabits.length === 0) {
        let message = document.createElement("p");
        message.textContent = "No habits left for today! 🌷";
        list.appendChild(message);
        return;
    }

    todaysHabits.forEach(habit => {
        let box = document.createElement("div");
        box.className = "category";
        box.style.gap = "12px";

        let check = document.createElement("button");
        check.type = "button";
        check.textContent = "○";
        check.setAttribute(
            "aria-label",
            "Complete " + habit.name
        );

        check.style.background = "none";
        check.style.border = "none";
        check.style.fontSize = "30px";
        check.style.color = "#A3B59B";
        check.style.cursor = "pointer";

        check.onclick = () => completeHabit(habit.id);

        let name = document.createElement("span");
        name.textContent = habit.name;
        name.style.flex = "1";

        let progress = document.createElement("span");
        progress.className = "count";

        let completed = habit.completedDates || [];
        let currentDay = completed.length + 1;

        progress.textContent =
            "Day " + currentDay + "/" + habit.goalDays;

        box.appendChild(check);
        box.appendChild(name);
        box.appendChild(progress);

        list.appendChild(box);
    });
}

let showingAllHabits = false;

function toggleAllHabits() {
    showingAllHabits = !showingAllHabits;

    let button = document.getElementById("viewAllButton");

    button.textContent = showingAllHabits
        ? "← Back to Today's Habits"
        : "View All Habits";

    showHabits();
}

function showAllHabits() {
    let list = document.getElementById("habitList");
    list.replaceChildren();

    let categoryHabits = habits.filter(
        habit => habit.category === currentCategory
    );

    if (categoryHabits.length === 0) {
        let message = document.createElement("p");
        message.textContent = "No habits added yet!";
        list.appendChild(message);
        return;
    }

    categoryHabits.forEach(habit => {
        let box = document.createElement("div");
        box.className = "category";
        box.style.display = "block";

        let name = document.createElement("div");
        name.textContent = habit.name;
        name.style.fontWeight = "bold";

        let details = document.createElement("div");
        details.className = "count";
        details.style.marginTop = "8px";

        let completed = habit.completedDates || [];
        let goal = habit.goalDays || "?";

        let schedule = Array.isArray(habit.weekdays)
            ? habit.weekdays.join(", ")
            : "Days not set";

        details.textContent =
            completed.length + "/" + goal +
            " days • " + schedule;
details.textContent +=
    " | 🔥 Streak: " + getHabitStreak(habit);
        let status = document.createElement("div");
        status.className = "count";
        status.style.marginTop = "8px";

        if (habit.goalDays &&
            completed.length >= habit.goalDays) {
            status.textContent = "Goal reached!";
        } else if (completed.includes(getTodayDate())) {
            status.textContent = "✓ Completed today";
        } else if (isDueToday(habit)) {
            status.textContent = "○ Due today";
        } else {
            status.textContent = "Not scheduled today";
        }

        box.appendChild(name);
        box.appendChild(details);
        box.appendChild(status);

let freezeInfo = document.createElement("div");
freezeInfo.className = "count";
freezeInfo.style.marginTop = "10px";

let freezes = habit.streakFreezes || 0;
let streak = getHabitStreak(habit);

freezeInfo.textContent =
    "❄️ Streak Freezes: " + freezes + "/2";

if (freezes < 2) {
    let nextFreeze = 14 - (streak % 14);

    freezeInfo.textContent +=
        " | Next freeze in " +
        nextFreeze + " successful days";
}

box.appendChild(freezeInfo);

let editButton = document.createElement("button");

editButton.textContent = "✎ Edit Habit";
editButton.type = "button";
editButton.style.marginTop = "12px";
editButton.style.padding = "10px 15px";
editButton.style.background = "#A3B59B";
editButton.style.color = "#41483F";
editButton.style.border = "none";
editButton.style.borderRadius = "10px";
editButton.style.cursor = "pointer";

editButton.onclick = () => editHabit(habit.id);

box.appendChild(editButton);

        list.appendChild(box);
    });
}

function editHabit(id) {
    let habit = habits.find(h => h.id === id);

    if (!habit) return;

    let name = prompt("Edit habit name:", habit.name);

    if (name === null) return;

    if (name.trim() === "") {
        alert("Your habit needs a name.");
        return;
    }

    let answer = prompt(
        "How many successful days is your goal?",
        habit.goalDays || 30
    );

    if (answer === null) return;

    let goalDays = Number(answer);

    if (!Number.isSafeInteger(goalDays) || goalDays < 1) {
        alert("Please enter a valid number of days.");
        return;
    }

    let completed = (habit.completedDates || []).length;

    if (goalDays < completed) {
        alert("Your goal cannot be less than the days already completed.");
        return;
    }

    let dayNames = [
        "Mon", "Tue", "Wed", "Thu",
        "Fri", "Sat", "Sun"
    ];

    let currentDays = habit.weekdays || [];

    let defaultDays = currentDays.length === 7
        ? "ALL"
        : currentDays.map(
            day => dayNames.indexOf(day) + 1
        ).join(",") || "ALL";

    let daysAnswer = prompt(
        "Choose your weekdays:\n\n" +
        "1 = Monday\n" +
        "2 = Tuesday\n" +
        "3 = Wednesday\n" +
        "4 = Thursday\n" +
        "5 = Friday\n" +
        "6 = Saturday\n" +
        "7 = Sunday\n\n" +
        "Enter numbers like 1,3,5 or ALL.",
        defaultDays
    );

    if (daysAnswer === null) return;

    let weekdays;

    if (daysAnswer.trim().toUpperCase() === "ALL") {
        weekdays = [...dayNames];
    } else {
        let selected = daysAnswer.split(",").map(
            day => day.trim()
        );

        if (selected.some(day => !/^[1-7]$/.test(day))) {
            alert("Please enter numbers 1-7, or ALL.");
            return;
        }

        weekdays = [...new Set(
            selected.map(day => dayNames[Number(day) - 1])
        )];

        weekdays.sort(
            (a, b) => dayNames.indexOf(a) - dayNames.indexOf(b)
        );
    }

    habit.name = name.trim();
    habit.goalDays = goalDays;
    habit.weekdays = weekdays;

    localStorage.setItem(
        "vtHabits",
        JSON.stringify(habits)
    );

    showHabits();
    updateCounts();
}

function updateCounts() {
    document.querySelectorAll("#homeScreen .category")
        .forEach(button => {

            let category =
                button.querySelector("span").textContent;

            let count = habits.filter(
                habit =>
                    habit.category === category &&
                    isDueToday(habit)
            ).length;

            button.querySelector(".count").textContent =
                count + " left today ❯";
        });
}

function downloadBackup() {
    let backup = {
        app: "Visual Transformation",
        version: 1,
        exportedAt: new Date().toISOString(),
        habits: habits
    };

    let file = new Blob(
        [JSON.stringify(backup, null, 2)],
        { type: "application/json" }
    );

    let url = URL.createObjectURL(file);

    let link = document.createElement("a");
    link.href = url;
    link.download =
        "visual-transformation-backup-" +
        getTodayDate() + ".json";

    document.body.appendChild(link);
    link.click();
    link.remove();

    setTimeout(() => URL.revokeObjectURL(url), 1000);
}

updateCounts();
</script>


</body>
</html>
